<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet.URL | Encurtador Premium</title>
    <link rel="icon" type="image/png" href="/public/favicon_jeturl.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: {
                extend: {
                    colors: {
                        brand: '#f3bf43', dark: '#080808', card: '#111111', 
                        borderDark: '#222222', brandLight: '#d4af37', brandBlue: '#4B67FA'
                    },
                    fontFamily: { mono: ['ui-monospace', 'monospace'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-dark dark:text-white font-sans antialiased min-h-screen transition-colors duration-300">
    
    <div id="app" class="flex flex-col min-h-screen">
        {% include 'components/header.html' %}
        
        <!-- O bloco 'content' é onde a página específica será injetada -->
        {% block content %}{% endblock %}
        
        {% include 'components/footer.html' %}
    </div>

    <!-- Módulo Vue principal -->
    <script type="module" src="/frontend/app.js"></script>
</body>
</html>
