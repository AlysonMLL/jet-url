<!-- O QUE HÁ AQUI:
- Header com logo e toggle button (claro/escuro)
(Topo do site) 
-->

<header class="p-8 flex justify-between items-center max-w-5xl mx-auto w-full">
    <div class="flex items-center">
        <img :src="isDarkTheme ? '/assets/logo-jet.url_darkmode.png' : '/assets/logo-jet.url_lightmode.png'" alt="Logo" class="h-16 w-auto transition-all">
    </div>
    
    <div class="flex items-center gap-6">
        <!-- Anchor Link -->
        <a href="#tutorial-faq" class="bg-slate-200 hidden sm:inline-flex items-center gap-2 rounded-lg border border-slate-300 px-4 py-2 text-[12px] font-bold uppercase tracking-[0.12em] text-slate-600 shadow-sm transition-all duration-300 hover:-translate-y-0.5 hover:border-brandLight hover:text-brandLight hover:shadow-[0_0_18px_rgba(243,191,67,0.18)] dark:border-brand dark:bg-transparent dark:text-brand dark:hover:border-brand dark:hover:text-brand">
            <span class="relative after:absolute after:left-0 after:-bottom-1 after:h-0.5 after:w-full after:origin-left after:scale-x-0 after:bg-current after:transition-transform after:duration-300 hover:after:scale-x-100">Como usar?</span>
        </a>
        
        <button @click="alternarTema" class="p-2 rounded-lg bg-transparent text-brand border border-brand transition-all duration-300 hover:bg-brand hover:text-black hover:shadow-[0_0_20px_rgba(243,191,67,0.45)] hover:-translate-y-1" aria-label="Alternar tema claro e escuro" title="Alternar tema">
            <svg v-if="isDarkTheme" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg v-else class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24 "><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
    </div>
</header>
